name: Run Pytest

on:
 pull_request:
  branches: ["main"]

jobs:
 test:
  runs-on: windows-latest
  
  steps:
   - name: Checkout repository
     uses: actions/checkout@v7.0.1
  
   - name: Setup Python
     uses: actions/setup-python@v5
     with:
      python-version: 3.13

   - name: Install dependencies
     run: pip install -r requirements.txt

   - name: Run pytest 
     run: pytest  